<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=search"/>

    <link href="styles/style.css" rel="stylesheet" type="text/css"/>

    <script src="scripts/main.js" defer></script>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отзывы - МойАнимеСписок</title>
    <script src="scripts/form-runtime.js" defer></script>
    <meta name="description" content="Каталог аниме и манги, рейтинги, списки и отзывы">
    <meta name="keywords" content="аниме, каталог, рейтинги, отзывы, новости, список, манга">
</head>
<body>

<header class="hheader">
    <div class="header-top">
        <a href="index_static.html" class="homepage"><h1>МойАнимеСписок</h1></a>
        <ul class="auth">
            <li><a href="#" class="login">Вход</a></li>
            <li><a href="#" class="signup">Регистрация</a></li>
        </ul>
    </div>

    <div class="header-bottom">
        <nav class="main-nav" aria-label="Основная навигация">
            <ul>
                <li><a href="anime.html">Аниме</a></li>
                <li><a href="manga.html">Манга</a></li>
                <li><a href="watch.html">Смотреть</a></li>
                <li><a href="read.html">Читать</a></li>
                <li><a href="about.html">О нас</a></li>
                <li><a href="feedback.html">Отзывы</a></li>
            </ul>
        </nav>

        <form role="search">
            <label for="q"></label>
            <input id="q" name="q" type="search" placeholder="Название тайтла">
            <button type="submit" class="search-btn">
                <span class="material-symbols-outlined">search</span>
            </button>
        </form>
    </div>
</header>

<main>
    <section class="feedback-section">
        <h2>Оставить отзыв</h2>

        <form id="feedback-form" novalidate>
            <div class="form-row">
                <label for="fb-name">Имя</label>
                <input
                        id="fb-name"
                        name="name"
                        type="text"
                        placeholder="Ваше имя"
                        required
                        minlength="2"
                        maxlength="40">
            </div>

            <div class="form-row">
                <label for="fb-comment">Отзыв</label>
                <textarea
                        id="fb-comment"
                        name="comment"
                        rows="4"
                        placeholder="Ваш отзыв о сайте"
                        required
                        minlength="5"
                        maxlength="400"></textarea>
            </div>

            <button type="submit" class="feedback-submit-btn">Добавить</button>
        </form>
    </section>

    <section class="feedback-list-section">
        <h2>Все отзывы</h2>

        <div id="feedback-list"></div>

        <template id="feedback-item-template">
            <article class="feedback-item" data-id="">
                <h3 class="feedback-item__name"></h3>
                <p class="feedback-item__comment"></p>
                <div class="feedback-item__actions">
                    <button type="button" class="feedback-item__edit-btn">Изменить</button>
                    <button type="button" class="feedback-item__delete-btn">Удалить</button>
                </div>
            </article>
        </template>
    </section>
</main>

<footer>
    <p>&copy; 2025 МойАнимеСписок.</p>
    <div class="footer-banner">Реклама: лучший VPN для аниме!</div>
    <nav aria-label="Нижняя навигация">
        <ul>
            <li><a href="about.html">О нас</a></li>
            <li><a href="feedback.html">Отзывы</a></li>
            <li><a href="#">Правила</a></li>
        </ul>
    </nav>
</footer>

</body>
</html>
